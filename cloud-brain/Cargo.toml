[package]
name = "vectorvroom-brain"
version = "0.1.0"
edition = "2021"
publish = false
description = "One shared vector memory for VectorVroom, as a Rust Worker (docs/plan/cloud-brain.md)."

# Standalone: the beta toolchain and the Emscripten target stay out of any
# other workspace. `core` is the service without `worker` (native tests);
# .work/ holds the fetched ruvector sources, a workspace of their own, and
# core/fuzz the fuzz targets (nightly, CB4).
[workspace]
members = ["core", "sim"]
exclude = [".work", "core/fuzz"]

[dependencies]
worker = "=0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
brain = { package = "vectorvroom-brain-core", path = "core" }
futures-util = { version = "0.3", default-features = false }

[features]
# Spike-only routes (CB0): a SQL round trip, a panic, module memory, and a
# compute benchmark of up to 100 000 brains. Never in a
# deployed build.
spike = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

name: Deploy to Cloudflare Pages

# Triggers:
#   - push to main            → production deploy (vv.shaal.dev)
#   - pull_request            → preview deploy at <branch>.vectorvroom.pages.dev
#   - workflow_dispatch       → manual redeploy button in the Actions tab
#
# Uses cloudflare/wrangler-action@v3, which shells out to the same
# `wrangler pages deploy` command the local scripts/deploy-cloudflare.sh
# uses. No build step — the WASM is pre-vendored under vendor/ruvector/.
#
# Why this workflow instead of Cloudflare's native Git integration?
# The Pages project was created via `wrangler pages project create`
# (direct-upload mode); Cloudflare's dashboard doesn't support adding a
# Git source to direct-upload projects retroactively. This workflow
# gives us the same push-to-deploy + PR-preview ergonomics without
# recreating the project.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write  # so wrangler-action can comment preview URLs on PRs

# Only one deploy at a time per branch — if a new push lands while an
# earlier deploy is still running, cancel the older one. Avoids out-of-
# order productions landings and redundant uploads.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Publish ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Deploy live multiplayer service
        id: live
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.103.0'
          command: >-
            deploy --config multiplayer/wrangler.jsonc
            --name=${{ github.event_name == 'pull_request' && format('vectorvroom-live-pr-{0}', github.event.pull_request.number) || 'vectorvroom-live' }}

      # The cloud brain (docs/plan/cloud-brain.md, CB5): a Rust Worker built
      # for wasm32-unknown-emscripten with its own pinned toolchain and
      # wrangler (cloud-brain/package.json). Production is vectorvroom-brain;
      # a PR gets vectorvroom-brain-pr-<n>, with its own Durable Object. It
      # needs the Workers Paid plan (D2): wrangler.jsonc sets limits.cpu_ms,
      # which a Free account refuses. The page offers Shared only when the
      # deployed Worker's /health answers ok with its brain and limits.
      - uses: ./.github/actions/cloud-brain-toolchain
        id: brain-toolchain
        continue-on-error: true
        with:
          target-cache: deploy

      - name: Deploy the cloud brain
        id: brain
        if: steps.brain-toolchain.outcome == 'success'
        continue-on-error: true
        working-directory: cloud-brain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAIN_NAME: ${{ github.event_name == 'pull_request' && format('vectorvroom-brain-pr-{0}', github.event.pull_request.number) || 'vectorvroom-brain' }}
        run: |
          npm ci
          npx wrangler deploy --name "$BRAIN_NAME" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [[ -z "$url" ]]; then echo "::error::No workers.dev URL in the deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          node ../scripts/cloud-brain-health.mjs "$url"

      - name: Configure live endpoint and stage static site
        env:
          LIVE_ENDPOINT: ${{ steps.live.outputs.deployment-url }}
          BRAIN_ENDPOINT: ${{ steps.brain.outcome == 'success' && steps.brain.outputs.url || '' }}
        run: |
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            const endpoint = process.env.LIVE_ENDPOINT ? new URL(process.env.LIVE_ENDPOINT) : null;
            if (endpoint && endpoint.protocol !== "https:") throw new Error("Invalid multiplayer endpoint");
            writeFileSync("AI-Car-Racer/multiplayer/config.json", JSON.stringify({endpoint:endpoint?.origin ?? null}) + "\n");
            // The cloud brain: null hides the Shared option (a failed deploy or health check).
            const brain = process.env.BRAIN_ENDPOINT ? new URL(process.env.BRAIN_ENDPOINT) : null;
            if (brain && brain.protocol !== "https:") throw new Error("Invalid cloud brain endpoint");
            writeFileSync("AI-Car-Racer/cloud/config.json", JSON.stringify({endpoint:brain?.origin ?? null}) + "\n");
          '
          mkdir -p .pages-upload
          rsync -a --exclude='.git' --exclude='.github' --exclude='.pages-upload' --exclude='.wrangler' --exclude='node_modules' --exclude='test-results' --exclude='/multiplayer' --exclude='/cloud-brain' --exclude='/tests' --exclude='/scripts' --exclude='/ruvector' ./ .pages-upload/
          node scripts/stage-release.mjs .pages-upload "$GITHUB_SHA"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.103.0'
          command: >-
            pages deploy .pages-upload
            --project-name=vectorvroom
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
            --commit-message=${{ toJSON(github.event.head_commit.message || github.event.pull_request.title) }}

      - name: Summary
        run: |
          echo "### Cloudflare Pages deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.head_ref || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment URL: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alias URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloud brain: ${{ steps.brain.outputs.url || 'not deployed (Shared hidden)' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report multiplayer deployment failure
        if: steps.live.outcome == 'failure'
        run: |
          echo "::error::The static preview is deployed, but the live multiplayer service could not deploy. Check the service step above. Cloudflare Workers access is required; an optional CLOUDFLARE_WORKERS_API_TOKEN can be provided separately from the Pages token."
          exit 1

      - name: Report cloud brain deployment failure
        if: steps.brain-toolchain.outcome == 'failure' || steps.brain.outcome == 'failure'
        run: |
          echo "::error::The static site is deployed with the Shared option hidden: the cloud brain did not deploy or its /health check failed. Check the cloud brain steps above (the Workers Paid plan, CLOUDFLARE_WORKERS_API_TOKEN with Workers Scripts: Edit, docs/operations/cloud-brain-operations.md)."
          exit 1

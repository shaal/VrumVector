name: Circuit Studio graphics
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:graphics
      - run: npx playwright install --with-deps chromium
      - run: npm run test:graphics:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-studio-graphics
          path: test-results/graphics/
          retention-days: 14

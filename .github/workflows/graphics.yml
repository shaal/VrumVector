name: Circuit Studio graphics
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl, auto]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:graphics
      - run: npx playwright install --with-deps chromium
      - name: Install software Vulkan and virtual display
        run: sudo apt-get install -y mesa-vulkan-drivers xvfb
      - run: xvfb-run -a npm run test:graphics:browser
        env:
          STUDIO_TEST_BACKEND: ${{ matrix.backend }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: circuit-studio-${{ matrix.backend }}
          path: test-results/graphics/
          retention-days: 14

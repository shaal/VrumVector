name: Build learning WASM
on:
  push:
    branches: ['codex/sona-checkpoints', 'codex/trainable-gnn']
    paths: ['scripts/ruvector-patches/**', 'scripts/build-learning-wasm.sh', '.github/workflows/learning-wasm.yml', 'tests/learning-wasm.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-wasm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'shaal/VrumVector' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
          key: learning-tools-rust1.85-wasm-pack0.13.1-v1
      - name: Install pinned Rust and wasm-pack
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.85.0
          if [[ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.13.1" ]]; then cargo install wasm-pack --version 0.13.1 --locked; fi
      - run: bash scripts/build-learning-wasm.sh
      - name: Commit generated bindings and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/ruvector/sona scripts/ruvector-patches/sona.Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild SONA checkpoint WASM from pinned sources'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Behavioural cloning
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Trains clones of teacher networks in the real car simulator (1-2 minutes).
      - run: npm run test:cloning
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: npm run test:cloning:browser
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: behavioural-cloning
          path: test-results/cloning/
          retention-days: 14

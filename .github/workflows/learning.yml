name: Driver profiles and learning
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:learning
      - run: npm run test:learning:wasm
      - run: npm run test:crash-maps
      - run: npm run test:gnn:wasm
      - run: npm run test:gnn
      - run: npx playwright install --with-deps chromium
      - run: npm run test:learning:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: driver-profiles-learning
          path: test-results/learning/
          retention-days: 14
